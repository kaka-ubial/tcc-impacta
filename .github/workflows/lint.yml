name: linter

on:
  push:
    branches:
      - develop
      - release
      - main
      - master
  pull_request:
    branches:
      - develop
      - release
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # As rotas do Wayfinder sao geradas, nao versionadas. Sem --with-form nao
      # saem as variantes usadas nos formularios e o types:check quebra com erro
      # falso. O vite.config.ts usa formVariants: true.
      - name: Gerar rotas do Wayfinder
        run: php artisan wayfinder:generate --with-form

      - name: Pint (formatacao PHP)
        run: composer lint:check

      - name: ESLint
        run: npm run lint:check

      - name: Prettier (formatacao front)
        run: npm run format:check

      - name: TypeScript
        run: npm run types:check
