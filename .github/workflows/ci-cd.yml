# Pipeline CI/CD — TCC Impacta (GitHub Actions)
#
# Espelha o gitflow do projeto — cada branch deploya seu ambiente:
#   develop -> ambiente DEV     (integracao continua do time)
#   release -> ambiente TEST    (staging / homologacao)
#   main    -> ambiente PROD    (com aprovacao manual)
#
# A promocao entre ambientes acontece via git, como o time ja faz:
# merge develop->release sobe pro TEST; PR release->main sobe pra PROD.
# Toda run builda + testa antes de deployar; o deploy so roda se os
# testes passarem.
#
# Requisitos no GitHub (Settings do repo, fora deste arquivo):
#   - Environments: dev, test, prod (prod com "Required reviewers")
#   - Secrets (Actions): DOCKERHUB_TOKEN, RENDER_HOOK_DEV, RENDER_HOOK_TEST,
#     RENDER_HOOK_PROD
#   - Variable (Actions): DOCKERHUB_USER

name: CI/CD

on:
  push:
    branches: [develop, release, main]
  # Execucao noturna (na main) mesmo sem commits — evidencia de funcionamento
  # continuo; roda so build+testes, sem deploy
  schedule:
    - cron: "0 3 * * *"
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USER }}/tcc-impacta

jobs:
  # ---------------------------------------------------------------- BUILD + TEST
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, curl, zip, pdo_sqlite

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O Wayfinder roda `php artisan` durante o build do Vite, por isso o
      # front so builda depois do composer install + .env prontos
      - name: Build do front (Vite + Wayfinder)
        run: |
          npm ci
          npm run build

      # DB via env real ganha do .env e do phpunit.xml — testes rodam em
      # SQLite em memoria, sem depender de banco externo
      - name: Executar testes (Pest)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: vendor/bin/pest --log-junit test-results.xml

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Login no Docker Hub
        if: github.event_name != 'schedule'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem Docker
        if: github.event_name != 'schedule'
        run: |
          docker build -t "$IMAGE:${{ github.run_number }}" .
          docker push "$IMAGE:${{ github.run_number }}"

  # ---------------------------------------------------------------- DEPLOY DEV
  deploy-dev:
    name: Deploy DEV
    needs: build-test
    if: github.ref == 'refs/heads/develop' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://impacta-dev.onrender.com
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagem :dev e disparar deploy
        run: |
          docker buildx imagetools create -t "$IMAGE:dev" "$IMAGE:${{ github.run_number }}"
          curl -fsS "${{ secrets.RENDER_HOOK_DEV }}"

  # ---------------------------------------------------------------- DEPLOY TEST
  deploy-test:
    name: Deploy TEST (staging)
    needs: build-test
    if: github.ref == 'refs/heads/release' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://impacta-test.onrender.com
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagem :test e disparar deploy
        run: |
          docker buildx imagetools create -t "$IMAGE:test" "$IMAGE:${{ github.run_number }}"
          curl -fsS "${{ secrets.RENDER_HOOK_TEST }}"

  # ---------------------------------------------------------------- DEPLOY PROD
  deploy-prod:
    name: Deploy PROD
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # O environment "prod" deve ter Required reviewers — a run para aqui
    # esperando aprovacao manual antes de subir producao
    environment:
      name: prod
      url: https://impacta-prod.onrender.com
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagem :prod e disparar deploy
        run: |
          docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:${{ github.run_number }}"
          curl -fsS "${{ secrets.RENDER_HOOK_PROD }}"
