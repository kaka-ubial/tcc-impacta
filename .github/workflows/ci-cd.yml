name: CI/CD

on:
  push:
    branches: [develop, release, main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USER }}/tcc-impacta

jobs:
  # ---------------------------------------------------------------- BUILD + TEST
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, curl, zip, pdo_sqlite

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build do front (Vite + Wayfinder)
        run: |
          npm ci
          npm run build

      - name: Executar testes (Pest)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: vendor/bin/pest --log-junit test-results.xml

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Login no Docker Hub
        if: github.event_name != 'schedule'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem Docker
        if: github.event_name != 'schedule'
        run: |
          docker build -t "$IMAGE:${{ github.run_number }}" .
          docker push "$IMAGE:${{ github.run_number }}"

  # ---------------------------------------------------------------- DEPLOY DEV
  deploy-dev:
    name: Deploy DEV
    needs: build-test
    if: github.ref == 'refs/heads/develop' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://tcc-impacta-dev.onrender.com
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagem :dev e disparar deploy
        run: |
          docker buildx imagetools create -t "$IMAGE:dev" "$IMAGE:${{ github.run_number }}"
          curl -fsS "${{ secrets.RENDER_HOOK_DEV }}"
      
      - name: Health check
        run: |
          sleep 90   # da tempo do Render trocar a instancia
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://tcc-impacta-dev.onrender.com/up) || code=000
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::ambiente DEV nao respondeu 200 em /up"
          exit 1

  # ---------------------------------------------------------------- DEPLOY TEST
  deploy-test:
    name: Deploy TEST (staging)
    needs: build-test
    if: github.ref == 'refs/heads/release' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://tcc-impacta-test.onrender.com
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagem :test e disparar deploy
        run: |
          docker buildx imagetools create -t "$IMAGE:test" "$IMAGE:${{ github.run_number }}"
          curl -fsS "${{ secrets.RENDER_HOOK_TEST }}"

      - name: Health check
        run: |
          sleep 90   # da tempo do Render trocar a instancia
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://tcc-impacta-test.onrender.com/up) || code=000
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::ambiente TEST nao respondeu 200 em /up"
          exit 1

  # ---------------------------------------------------------------- DEPLOY PROD
  deploy-prod:
    name: Deploy PROD
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://tcc-impacta-prod.onrender.com
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagem :prod e disparar deploy
        run: |
          docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:${{ github.run_number }}"
          curl -fsS "${{ secrets.RENDER_HOOK_PROD }}"

      - name: Health check
        run: |
          sleep 90   # da tempo do Render trocar a instancia
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://tcc-impacta-prod.onrender.com/up) || code=000
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::ambiente PROD nao respondeu 200 em /up"
          exit 1