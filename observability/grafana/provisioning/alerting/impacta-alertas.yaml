apiVersion: 1

groups:
    - orgId: 1
      name: impacta-disponibilidade
      folder: Impacta
      interval: 1m
      rules:
          - uid: impacta-fora-do-ar
            title: Site fora do ar
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            labels:
                severity: critical
                app: impacta
            annotations:
                summary: O ambiente de dev nao responde ha 10 minutos.
                description: >-
                    O Prometheus nao consegue raspar https://tcc-impacta-dev.onrender.com/metrics.
                    Causas provaveis, em ordem: deploy em andamento, instancia do Render
                    hibernando, ou o servico realmente fora do ar. Confira o painel do
                    Render antes de investigar a aplicacao.
            data:
                - refId: A
                  relativeTimeRange:
                      from: 600
                      to: 0
                  datasourceUid: prometheus-impacta
                  model:
                      refId: A
                      expr: up{app="impacta"}
                      instant: false
                      range: true
                - refId: B
                  datasourceUid: __expr__
                  model:
                      refId: B
                      type: reduce
                      reducer: last
                      expression: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: B
                      conditions:
                          - evaluator:
                                type: lt
                                params:
                                    - 1

    - orgId: 1
      name: impacta-aplicacao
      folder: Impacta
      interval: 1m
      rules:
          - uid: impacta-taxa-erro
            title: Taxa de erro acima de 5%
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Error
            labels:
                severity: critical
                app: impacta
            annotations:
                summary: Mais de 5% das requisicoes estao respondendo 5xx.
                description: >-
                    Verifique o painel "Requisicoes por status HTTP" para identificar
                    quais rotas estao falhando, e os logs no painel do Render para a
                    exception correspondente.
            data:
                - refId: A
                  relativeTimeRange:
                      from: 600
                      to: 0
                  datasourceUid: prometheus-impacta
                  model:
                      refId: A
                      expr: sum by (env) (rate(impacta_http_requests_total{status=~"5.."}[5m])) / sum by (env) (rate(impacta_http_requests_total[5m]))
                      instant: false
                      range: true
                - refId: B
                  datasourceUid: __expr__
                  model:
                      refId: B
                      type: reduce
                      reducer: last
                      expression: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: B
                      conditions:
                          - evaluator:
                                type: gt
                                params:
                                    - 0.05

          - uid: impacta-latencia-alta
            title: Site lento (p95 acima de 2s)
            condition: C
            for: 15m
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                app: impacta
            annotations:
                summary: O p95 de latencia passou de 2 segundos por 15 minutos.
                description: >-
                    1 em cada 20 requisicoes esta demorando mais de 2s. Use o painel
                    "Rotas mais lentas (p95)" para descobrir qual rota puxa a media.
                    Picos isolados logo apos periodos ociosos costumam ser cold start
                    da instancia gratuita do Render, nao um problema da aplicacao.
            data:
                - refId: A
                  relativeTimeRange:
                      from: 900
                      to: 0
                  datasourceUid: prometheus-impacta
                  model:
                      refId: A
                      expr: histogram_quantile(0.95, sum by (env, le) (rate(impacta_http_request_duration_seconds_bucket[5m])))
                      instant: false
                      range: true
                - refId: B
                  datasourceUid: __expr__
                  model:
                      refId: B
                      type: reduce
                      reducer: last
                      expression: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: B
                      conditions:
                          - evaluator:
                                type: gt
                                params:
                                    - 2

    - orgId: 1
      name: impacta-negocio
      folder: Impacta
      interval: 1m
      rules:
          - uid: impacta-jobs-falhando
            title: Jobs falhando
            condition: C
            for: 0m
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                app: impacta
            annotations:
                summary: Mais de 5 jobs falharam nos ultimos 15 minutos.
                description: >-
                    Jobs que esgotaram as tentativas. Como a fila processa envio de
                    e-mail e notificacoes, falha aqui significa usuario que nao foi
                    avisado. Consulte a tabela failed_jobs para a exception.
            data:
                - refId: A
                  relativeTimeRange:
                      from: 900
                      to: 0
                  datasourceUid: prometheus-impacta
                  model:
                      refId: A
                      expr: sum by (env) (increase(impacta_jobs_falhados_total[15m]))
                      instant: false
                      range: true
                - refId: B
                  datasourceUid: __expr__
                  model:
                      refId: B
                      type: reduce
                      reducer: last
                      expression: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: B
                      conditions:
                          - evaluator:
                                type: gt
                                params:
                                    - 5

    - orgId: 1
      name: impacta-pipeline
      folder: Impacta
      interval: 5m
      rules:
          - uid: impacta-build-quebrado
            title: Build quebrado numa branch principal
            condition: C
            for: 0m
            noDataState: OK
            execErrState: Error
            labels:
                severity: warning
                area: pipeline
            annotations:
                summary: A ultima execucao de um workflow falhou em develop, release ou main.
                description: >-
                    Branch principal com build vermelho bloqueia o fluxo de promocao
                    (develop -> release -> main). Abra a aba Actions no GitHub, veja
                    qual passo falhou e corrija antes de seguir com merges. Branches de
                    feature ficam de fora de proposito: falha ali e normal durante o
                    desenvolvimento.
            data:
                - refId: A
                  relativeTimeRange:
                      from: 3600
                      to: 0
                  datasourceUid: prometheus-impacta
                  model:
                      refId: A
                      expr: impacta_pipeline_ultimo_resultado{branch=~"develop|release|main"}
                      instant: false
                      range: true
                - refId: B
                  datasourceUid: __expr__
                  model:
                      refId: B
                      type: reduce
                      reducer: last
                      expression: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: B
                      conditions:
                          - evaluator:
                                type: lt
                                params:
                                    - 1

          - uid: impacta-coletor-pipeline-parado
            title: Coletor de metricas de pipeline parado
            condition: C
            for: 15m
            noDataState: Alerting
            execErrState: Error
            labels:
                severity: warning
                area: pipeline
            annotations:
                summary: O coleta-github-actions.ps1 nao roda ha mais de 30 minutos.
                description: >-
                    A tarefa agendada "impacta-metricas-pipeline" deveria rodar a cada
                    10 minutos. Parada, TODOS os paineis do dashboard de pipeline
                    mostram dado velho sem nenhum aviso visivel. Verifique com
                    Get-ScheduledTask impacta-metricas-pipeline e se o gh CLI continua
                    autenticado (gh auth status).
                    Este e o unico alerta com noDataState: Alerting — aqui "sem dado"
                    e exatamente o incidente que se quer detectar.
            data:
                - refId: A
                  relativeTimeRange:
                      from: 3600
                      to: 0
                  datasourceUid: prometheus-impacta
                  model:
                      refId: A
                      expr: time() - impacta_pipeline_coleta_timestamp_segundos
                      instant: false
                      range: true
                - refId: B
                  datasourceUid: __expr__
                  model:
                      refId: B
                      type: reduce
                      reducer: last
                      expression: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      refId: C
                      type: threshold
                      expression: B
                      conditions:
                          - evaluator:
                                type: gt
                                params:
                                    - 1800
